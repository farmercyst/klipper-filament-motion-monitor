# Example configuration. Adjust the pin and calibration for your printer.
[filament_motion_monitor filament_sensor]
switch_pin: ^PA1
extruder: extruder
ticks_per_mm: 1.0
runout_length: 15.0
clog_detection_length: 50.0
clog_min_motion_ratio: 0.70
# Samples retained for the independent encoder/extruder flow-rate estimate.
# Minimum 5; Happy Hare-inspired default 20.
flowrate_samples: 20
pause_on_runout: True
pause_on_clog: True
# runout_gcode:
#   RESPOND TYPE=error MSG="Filament runout detected"
# clog_gcode:
#   RESPOND TYPE=error MSG="Possible filament clog detected"
# insert_gcode:
#   RESPOND MSG="Filament motion restored"
